[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slothcart"
version = "0.1.0"
description = "Fridge photo to grocery list, running entirely on your own machine."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
slothcart = "slothcart.cli:main"

[tool.setuptools.packages.find]
include = ["slothcart*"]
